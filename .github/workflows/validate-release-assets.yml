name: validate release assets

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'release-assets.sh'
      - 'validate-release-assets.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check pinned release assets
        run: ./validate-release-assets.sh
