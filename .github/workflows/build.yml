name: build

on:
  push:
    branches: [main]
    # Nothing outside the build inputs can change the image, and a rebuild is
    # ~4 minutes and a 4 GB push. Editing the README or Renovate config should
    # not trigger one.
    paths-ignore:
      - 'README.md'
      - 'renovate.json'
      - '.gitignore'
  # Build and smoke-test the image on the PR too, without publishing it.
  # `validate release assets` only checks that the download URLs resolve; it
  # cannot catch an upstream base that breaks the build or fails the smoke
  # test. Without this, the first time a bad bump is exercised is after it is
  # already on main. Same paths-ignore, for the same reason.
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'renovate.json'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      refresh_floating:
        description: 'Reinstall the unpinned npm/pip CLIs at their latest versions'
        type: boolean
        default: false
      no_cache:
        description: 'Full rebuild, ignore all cache'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Main stays serialized under one group, because two overlapping main builds
# could interleave run numbers and race on the same registry tag. Each PR gets
# its own group and cancels on a new push, since a PR build publishes nothing
# and only the newest commit is worth validating.
concurrency:
  group: build-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/openclaw

jobs:
  build:
    # A fork PR gets a read-only GITHUB_TOKEN, so the ghcr login and cache read
    # below would fail on permissions rather than on anything about the image.
    # The repo is public, so skip those outright instead of reporting a red
    # check that says nothing useful.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A ~4 GB image plus its build cache does not fit alongside the runner's
      # preinstalled toolchains. Reclaim ~25 GB first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:latest detect --source . --no-banner --redact

      # Tag is <upstream base version>-<run number>, and is never reused.
      #
      # Uniqueness is load-bearing because homelab pins the tag alone, with no
      # @sha256 digest. Compose compares the image *reference string*, not the
      # resolved digest — so an overwritten tag means `up -d` sees no change
      # and will not recreate the container even though a new image exists.
      # A fresh tag per build is what makes the deploy declarative, gives
      # Renovate something to bump, and makes rollback a `git revert`.
      - name: Derive tag from base image
        id: meta
        run: |
          set -euo pipefail
          base=$(grep -oP '^ARG BASE_VERSION=\K\S+' Dockerfile)
          tag="${base}-${{ github.run_number }}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "base $base -> tag $tag"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and load locally — deliberately NOT pushed here. The smoke test
      # below gates the push, because a green build does not mean a usable image.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: |
            FLOATING_REFRESH=${{ inputs.refresh_floating && github.run_id || '0' }}
          no-cache: ${{ inputs.no_cache == true }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          # A PR reads the shared cache but must not write it, or an unmerged
          # branch gets to decide what main builds from. Written as
          # not-a-PR-and-then, never PR-and-then-empty: the empty string is
          # falsy in a GitHub expression, so the latter would fall through to
          # the wrong branch of the ||.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

      - name: Smoke test
        run: |
          chmod +x smoke-test.sh
          ./smoke-test.sh "${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}"

      - name: Push
        if: github.event_name != 'pull_request'
        run: docker push "${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}"

      # A PR build stops here. Say so explicitly, so a green check is not read
      # as "that tag exists now".
      - name: Report validation only
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "## Validated, not published"
            echo
            echo "Built from base \`${{ steps.meta.outputs.base }}\` and passed the smoke test."
            echo "No image was pushed. Merging to \`main\` publishes the tag."
          } >> "$GITHUB_STEP_SUMMARY"

      # Print the exact line to paste into homelab's openclaw/compose.yaml.
      # The digest is reported alongside it for the record only — it is not
      # part of the deploy line, by choice.
      #
      # Skipped on a PR: nothing was pushed, so RepoDigests is empty and the
      # `index` below would fail the job on a build that is otherwise fine.
      - name: Report deploy line
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' \
            "${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}")
          {
            echo "## Deploy line"
            echo
            echo '```yaml'
            echo "image: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}"
            echo '```'
            echo
            echo "Built from base \`${{ steps.meta.outputs.base }}\`."
            echo "Digest for the record: \`${digest#*@}\`"
          } >> "$GITHUB_STEP_SUMMARY"
