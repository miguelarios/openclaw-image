name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_floating:
        description: 'Reinstall the unpinned npm/pip CLIs at their latest versions'
        type: boolean
        default: false
      no_cache:
        description: 'Full rebuild, ignore all cache'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/openclaw

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A ~4 GB image plus its build cache does not fit alongside the runner's
      # preinstalled toolchains. Reclaim ~25 GB first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:latest detect --source . --no-banner --redact

      # The tag tracks the upstream base version. Rebuilds of the same base
      # overwrite it; homelab pins the digest, so deploys stay immutable and
      # Renovate opens the bump PR when the digest moves.
      - name: Derive tag from base image
        id: meta
        run: |
          set -euo pipefail
          tag=$(grep -oP '^ARG BASE_VERSION=\K\S+' Dockerfile)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "base version: $tag"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and load locally — deliberately NOT pushed here. The smoke test
      # below gates the push, because a green build does not mean a usable image.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: |
            FLOATING_REFRESH=${{ inputs.refresh_floating && github.run_id || '0' }}
          no-cache: ${{ inputs.no_cache == true }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Smoke test
        run: |
          chmod +x smoke-test.sh
          ./smoke-test.sh "${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}"

      - name: Push
        run: docker push "${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}"

      # Print the exact line to paste into homelab's openclaw/compose.yaml.
      - name: Report digest
        run: |
          set -euo pipefail
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' \
            "${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}")
          {
            echo "## Deploy line"
            echo
            echo '```yaml'
            echo "image: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}@${digest#*@}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
